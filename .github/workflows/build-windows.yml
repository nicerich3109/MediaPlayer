name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "config/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python and UI configuration
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m json.tool config/ui.json | Out-Null

      - name: Install VLC runtime
        shell: pwsh
        run: |
          choco install vlc --yes --no-progress
          $vlc = "C:\Program Files\VideoLAN\VLC"
          if (!(Test-Path "$vlc\libvlc.dll")) {
            throw "libvlc.dll was not found in $vlc"
          }
          "VLC_DIR=$vlc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-build.txt

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name MediaPlayer --collect-all PySide6 --collect-all mutagen --hidden-import vlc --add-binary "$env:VLC_DIR\libvlc.dll;." --add-binary "$env:VLC_DIR\libvlccore.dll;." --add-data "$env:VLC_DIR\plugins;plugins" main.py
          if (!(Test-Path "dist\MediaPlayer\MediaPlayer.exe")) {
            throw "Executable was not created"
          }
          if (Test-Path "config") {
            Copy-Item -Path "config" -Destination "dist\MediaPlayer\config" -Recurse -Force
          }
          Compress-Archive -Path "dist\MediaPlayer\*" -DestinationPath "MediaPlayer-Windows-x64.zip" -Force

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlayer-Windows-x64
          path: MediaPlayer-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
